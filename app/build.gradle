plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.baer.mealiekiosk'
    compileSdk 36

    defaultConfig {
        applicationId "com.baer.mealiekiosk"
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        // Tested on an arm64 tablet (SM-T220); other ABIs only add Vosk native libs.
        ndk { abiFilters 'arm64-v8a' }
    }

    // Release key comes from ~/.gradle/gradle.properties or env vars; without it the release APK is unsigned.
    def key = { String name -> project.findProperty(name) ?: System.getenv(name) }
    signingConfigs {
        release {
            if (key('MEALIE_KIOSK_STORE_FILE')) {
                storeFile file(key('MEALIE_KIOSK_STORE_FILE'))
                storePassword key('MEALIE_KIOSK_STORE_PASSWORD')
                keyAlias key('MEALIE_KIOSK_KEY_ALIAS')
                keyPassword key('MEALIE_KIOSK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig key('MEALIE_KIOSK_STORE_FILE') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'com.alphacephei:vosk-android:0.3.75'
    testImplementation 'junit:junit:4.13.2'
}
